</style>
<defs><pattern id="d" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#30363d"/></pattern><rect width="1000" height="320" fill="url(#d)"/></defs>
<rect width="1000" height="320" rx="14" fill="#0d1117"/>
<rect width="1000" height="320" rx="14" fill="url(#d)" opacity=".55"/>
<rect x=".5" y=".5" width="999" height="319" rx="14" fill="none" stroke="#232a33"/>

<text x="48" y="74" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2" fill="#7d8590">ZARIF NOUR EL ISLAM  /  TUNIS</text>
<text x="46" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#e6edf3">I build web apps,</text>
<text x="46" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#f0b429">then I try to break them.</text>
<text x="48" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#7d8590">Computer science student. Full-stack developer,</text>

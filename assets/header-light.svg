<text class="l" style="animation-delay:0.40s" x="602" y="112" xml:space="preserve"><tspan fill="#1f2328">$ nmap -sV zarif</tspan></text><text class="l" style="animation-delay:0.75s" x="602" y="137" xml:space="preserve"><tspan fill="#59636e">PORT      SERVICE  VERSION</tspan></text><text class="l" style="animation-delay:1.10s" x="602" y="162" xml:space="preserve"><tspan fill="#1a7f37">80/tcp    </tspan><tspan fill="#1f2328">web      angular, next.js, flask</tspan></text><text class="l" style="animation-delay:1.45s" x="602" y="187" xml:space="preserve"><tspan fill="#1a7f37">443/tcp   </tspan><tspan fill="#1f2328">api      spring boot, node.js</tspan></text><text class="l" style="animation-delay:1.80s" x="602" y="212" xml:space="preserve"><tspan fill="#1a7f37">5555/tcp  </tspan><tspan fill="#1f2328">mobile   android (java)</tspan></text><text class="l" style="animation-delay:2.15s" x="602" y="237" xml:space="preserve"><tspan fill="#1a7f37">31337     </tspan><tspan fill="#1f2328">sec      web pentesting</tspan></text><text class="l" style="animation-delay:2.50s" x="602" y="262" xml:space="preserve"><tspan fill="#59636e">4 services up. still learning.</tspan></text>

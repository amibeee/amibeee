<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Zarif Nour El Islam. I build web apps, then I try to break them.">
<style>
.l{font:13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;opacity:0;animation:in .25s ease-out forwards}
.c{animation:blink 1s steps(1) infinite}
@keyframes in{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}.c{animation:none}}
</style>
<defs><pattern id="d" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d0d7de"/></pattern><rect width="1000" height="320" fill="url(#d)"/></defs>
<rect width="1000" height="320" rx="14" fill="#ffffff"/>
<rect width="1000" height="320" rx="14" fill="url(#d)" opacity=".55"/>
<rect x=".5" y=".5" width="999" height="319" rx="14" fill="none" stroke="#d8dee4"/>

<text x="48" y="74" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2" fill="#59636e">ZARIF NOUR EL ISLAM  /  TUNIS</text>
<text x="46" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#1f2328">I build web apps,</text>
<text x="46" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#b26b00">then I try to break them.</text>
<text x="48" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#59636e">Computer science student. Full-stack developer,</text>
